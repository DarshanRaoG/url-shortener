<div class="stats-div">
  <div class="stats-input-div">
    <input type="text" [(ngModel)]="shortUrl" />
    <button (click)="handleStatsClick()" [disabled]="!shortUrl() || loading()">Get Stats</button>
  </div>
  <div class="stats-output-div">
    @if (stats()) {
      <table>
        <tr>
          <td>Original URL</td>
          <td>{{ stats()?.originalUrl }}</td>
        </tr>
        <tr>
          <td>Clicks</td>
          <td>{{ stats()?.clickCount }}</td>
        </tr>
        <tr>
          <td>Created At</td>
          <td>{{ stats()?.createdAt }}</td>
        </tr>
        <tr>
          <td>Expires At</td>
          <td>{{ stats()?.expiresAt }}</td>
        </tr>
      </table>
    }
  </div>
</div>
