spring.application.name=url-shortener
server.port=8080

#------------------------------
# Database configurations
#------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/url_shortener?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Retry DB connection
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

#------------------------------
# Redis configurations
#------------------------------
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

#------------------------------
# Other configurations
#------------------------------
url.shortener.secret=${URL_SHORTENER_SECRET}
url.shortener.base-url=http://localhost:8080/api
url.shortener.default-expiry-days=30
url.shortener.default-rate-limit=100