spring.application.name=url-shortener
server.port=8080

#------------------------------
# Database configurations
#------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/url_shortener?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#------------------------------
# Redis configurations
#------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379

#------------------------------
# Other configurations
#------------------------------
url.shortener.secret=${URL_SHORTENER_SECRET}
url.shortener.base-url=http://localhost:8080/api
url.shortener.default-expiry-days=30
url.shortener.default-rate-limit=100